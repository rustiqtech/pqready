[package]
name = "pqready"
version = "0.1.0"
edition = "2024"
description = "Census of Solana on-chain programs that depend on quantum-vulnerable public-key cryptography"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
bs58 = "0.5"
clap = { version = "4", features = ["derive"] }
csv = "1"
goblin = { version = "0.9", default-features = false, features = ["elf32", "elf64", "endian_fd", "std"] }
hex = "0.4"
memchr = "2"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = "0.13"
